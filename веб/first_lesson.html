<!DOCTYPE html>

<html>

<body>
    <div id="root">

    </div>
    <script>
        const root = document.getElementById("root")

        function fetchItems(path, list){
            fetch(path)
                .then(response => response.json())
                .then(json => {
                    data = json
                    renderListItems(data, list)
            })
        }

        function renderList(path){
            const list = document.createElement("div")
            fetchItems(path, list)
            return list
        }

        function renderApp(root){
            const container = document.createElement("div")
            const title = document.createElement("hi")
            title.innerText = "Список"
            container.appendChild(title)
            root.appendChild(container)
            root.appendChild(renderList('https://jsonplaceholder.typicode.com/todos/'))
            
        }

        renderApp(root)

        function renderListItem(item){
            const row = document.createElement("div");
            row.innerText = item.title + " " + item.completed
            return row
        }

        function renderListItems(data, list) {
            data.forEach(item => {
                const row = renderListItem(item)
                list.appendChild(row)
            })
        }

        function myList{
            const [data, setData] = useState([])
            useEffect(()=>{
                fetch('https://jsonplaceholder.typicode.com/todos/')
                    .then(response => response.json())
                    .then(json => {
                        setData(json)
                })
            })
            return me
        }
    </script>
</body>

</html>
