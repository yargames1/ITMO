name: "sum_even_pstream(5, 1, 2, 3, 4, 5) == 6"
limit: 500
memory_size: 0x1000
memory_mapped_io:
  0x80: [5, 1, 2, 3, 4, 5]
  0x84: []
reports:
  - name: Check results
    slice: last
    view: |
      numio[0x80]: {io:0x80:dec}
      numio[0x84]: {io:0x84:dec}
    assert: |
      numio[0x80]: [] >>> []
      numio[0x84]: [] >>> [6]
