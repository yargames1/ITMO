name: "reverse_bytes(hello) == olleh"
limit: 600
memory_size: 0x1000
memory_mapped_io:
  0x80: [5, 104, 101, 108, 108, 111]
  0x84: []
reports:
  - name: Check results
    slice: last
    view: |
      numio[0x80]: {io:0x80:dec}
      numio[0x84]: {io:0x84:dec}
      symio[0x84]: {io:0x84:sym}
    assert: |
      numio[0x80]: [] >>> []
      numio[0x84]: [] >>> [111,108,108,101,104]
      symio[0x84]: "" >>> "olleh"
